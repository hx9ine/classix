{% load components %}

{% component "layout/modal" title=title %}

<form
    method="post"
    action="{{ post_url }}"
    hx-post="{{ post_url }}"
    hx-target="{{ target }}"
    hx-swap="innerHTML"
>
    {% csrf_token %}

    <div class="cx-form-grid">

        {% include "components/forms/field.html" with field=form.user %}

    </div>

    {% include "components/forms/actions.html" with submit_label=submit_label cancel_label="Cancel" %}

</form>

{% endcomponent %}
