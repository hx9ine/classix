{% if item.children %}

<div class="cx-sidebar__menu{% if item.expanded %} is-expanded{% endif %}">

    <button
        type="button"
        class="cx-sidebar__item{% if item.active %} is-active{% endif %}"
        aria-expanded="{% if item.expanded %}true{% else %}false{% endif %}"
    >

        <span class="cx-sidebar__item-icon">
            {% include "components/icon.html" with name=item.icon %}
        </span>

        <span class="cx-sidebar__item-label">
            {{ item.label }}
        </span>

        <span class="cx-sidebar__item-toggle">

            <span class="cx-sidebar__toggle-icon">

                <span class="cx-sidebar__toggle-icon-line cx-sidebar__toggle-icon-horizontal"></span>

                <span class="cx-sidebar__toggle-icon-line cx-sidebar__toggle-icon-vertical"></span>

            </span>

        </span>

    </button>

    {% include "sidebar/submenu.html" with children=item.children %}

</div>

{% else %}

<a
    href="{{ item.url }}"
    class="cx-sidebar__item{% if item.active %} is-active{% endif %}"
    {% if item.active %}aria-current="page"{% endif %}
>

    <span class="cx-sidebar__item-icon">
        {% include "components/icon.html" with name=item.icon %}
    </span>

    <span class="cx-sidebar__item-label">
        {{ item.label }}
    </span>

</a>

{% endif %}
