<form
    class="cx-search"
    {% if hx_get %}
    hx-get="{{ hx_get }}"
    {% endif %}
    {% if hx_target %}
    hx-target="{{ hx_target }}"
    {% endif %}
    hx-trigger="keyup changed delay:300ms"
    hx-swap="innerHTML"
>

    <div class="cx-search__input-wrapper">

        <svg
            class="cx-search__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <circle
                cx="11"
                cy="11"
                r="8"
            ></circle>

            <path
                d="m21 21-4.35-4.35"
            ></path>

        </svg>

        <input
            type="search"
            name="q"
            class="cx-search__input"
            placeholder="{{ placeholder|default:'Search...' }}"
            value="{{ request.GET.q }}"
            autocomplete="off"
        >

    </div>

</form>
