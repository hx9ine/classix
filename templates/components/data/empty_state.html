<div class="cx-empty-state">

    <h3 class="cx-empty-state__title">
        {{ title }}
    </h3>

    {% if message %}
        <p class="cx-empty-state__message">
            {{ message }}
        </p>
    {% endif %}

    {% if action %}
        <div class="cx-empty-state__action">
            {{ action|safe }}
        </div>
    {% endif %}

</div>
