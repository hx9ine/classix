{% load components %}

<div class="cx-empty-state">

    {% if icon %}

        <div class="cx-empty-state__icon">

            {{ icon|safe }}

        </div>

    {% endif %}

    <div class="cx-empty-state__content">

        <h3 class="cx-empty-state__title">

            {{ title|default:"Nothing to display" }}

        </h3>

        {% if description %}

            <p class="cx-empty-state__description">

                {{ description }}

            </p>

        {% endif %}

    </div>

    {% if action %}

        <div class="cx-empty-state__action">

            {{ action|safe }}

        </div>

    {% endif %}

</div>
