<div class="cx-form-group">

    {% if field.label %}

        <label
            for="{{ field.id_for_label }}"
            class="cx-label"
        >

            {{ field.label }}

            {% if field.field.required %}
                <span class="cx-required">*</span>
            {% endif %}

        </label>

    {% endif %}

    {{ field }}

    {% if field.help_text %}

        <small class="cx-help">

            {{ field.help_text }}

        </small>

    {% endif %}

    {% if field.errors %}

        <div class="cx-error">

            {% for error in field.errors %}

                <div>{{ error }}</div>

            {% endfor %}

        </div>

    {% endif %}

</div>
